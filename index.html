<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generalist Agent - AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #0a0a0b;
    --bg-secondary: #111113;
    --bg-card: #1c1c1f;
    --bg-input: #141416;
    --bg-hover: #252529;
    --accent: #8b5cf6;
    --accent-hover: #a78bfa;
    --accent-glow: rgba(139, 92, 246, 0.25);
    --accent-subtle: rgba(139, 92, 246, 0.1);
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --border: rgba(255, 255, 255, 0.06);
    --success: #22c55e;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.grid-bg {
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
}

.orb-container { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    animation: orbFloat 25s ease-in-out infinite;
}

.orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(139, 92, 246, 0.5) 0%, transparent 70%); top: -150px; right: -100px; }
.orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(217, 70, 239, 0.4) 0%, transparent 70%); bottom: -100px; left: -50px; animation-delay: -8s; }
.orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%); top: 40%; left: 30%; animation-delay: -16s; }

@keyframes orbFloat {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(40px, -40px); }
    50% { transform: translate(-30px, 30px); }
    75% { transform: translate(20px, 40px); }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }

.app-wrapper {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    height: 100vh;
}

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
}

.top-bar-left { display: flex; align-items: center; gap: 14px; }

.logo {
    width: 42px; height: 42px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    position: relative;
}

.logo::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    z-index: -1;
    filter: blur(14px);
    opacity: 0.5;
}

.brand-text h1 {
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-hover) 0%, #d946ef 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.brand-text span { font-size: 0.7rem; color: var(--text-muted); }

.status-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.7rem;
}

.status-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.icon-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
}

.icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.icon-btn svg { width: 16px; height: 16px; }

.chat-panel { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; margin: 20px 0; }

.chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; }

.welcome-icon {
    width: 64px; height: 64px;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin-bottom: 20px;
    position: relative;
}

.welcome-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    z-index: -1;
    filter: blur(16px);
    opacity: 0.4;
}

.welcome-title {
    font-size: 1.35rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent-hover) 0%, #d946ef 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}

.welcome-desc { font-size: 0.875rem; color: var(--text-secondary); max-width: 360px; margin-bottom: 28px; }

.feature-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 440px; }

.feature-card {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 0.775rem;
    color: var(--text-secondary);
    transition: all 0.15s ease;
}

.feature-card:hover { background: var(--bg-hover); color: var(--text-primary); }

.msg { display: flex; gap: 10px; animation: msgIn 0.2s ease; }

@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { flex-direction: row-reverse; }

.msg-avatar { width: 32px; height: 32px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.msg.bot .msg-avatar { background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%); }
.msg.user .msg-avatar { background: var(--bg-hover); border: 1px solid var(--border); }

.msg-wrap { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
.msg.user .msg-wrap { align-items: flex-end; }

.msg-bubble { padding: 12px 16px; border-radius: var(--radius-lg); font-size: 0.9rem; line-height: 1.6; }
.msg.bot .msg-bubble { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px; }
.msg.user .msg-bubble { background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%); color: white; border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg); }

.msg-time { font-size: 0.625rem; color: var(--text-muted); padding: 0 4px; }

.msg-bubble h2, .msg-bubble h3, .msg-bubble h4 { margin: 12px 0 6px; }
.msg-bubble h2 { font-size: 1rem; font-weight: 700; }
.msg-bubble h3 { font-size: 0.95rem; font-weight: 600; }
.msg-bubble h4 { font-size: 0.9rem; font-weight: 600; }
.msg-bubble strong { font-weight: 600; }
.msg-bubble em { font-style: italic; }
.msg-bubble a { color: var(--accent-hover); text-decoration: none; }
.msg-bubble code { font-family: 'Geist Mono', monospace; font-size: 0.85em; background: var(--bg-primary); padding: 2px 5px; border-radius: 4px; }
.msg-bubble pre { background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin: 10px 0; overflow-x: auto; }
.msg-bubble pre code { background: transparent; padding: 0; font-size: 0.8rem; }
.msg-bubble ul, .msg-bubble ol { margin: 8px 0; padding-left: 20px; }
.msg-bubble li { margin: 4px 0; }

.chat-input-area { padding: 14px 18px; background: var(--bg-card); border-top: 1px solid var(--border); }

.chat-input-wrap { display: flex; gap: 10px; align-items: flex-end; }

.chat-input-box {
    flex: 1;
    display: flex; align-items: flex-end;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 3px;
    transition: all 0.15s ease;
}

.chat-input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }

.chat-input {
    flex: 1;
    padding: 11px 14px;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 0.9rem;
    font-family: 'Geist', sans-serif;
    resize: none;
    max-height: 130px;
    min-height: 44px;
    line-height: 1.5;
}

.chat-input:focus { outline: none; }
.chat-input::placeholder { color: var(--text-muted); }

.send-btn {
    width: 44px; height: 44px;
    border-radius: var(--radius-md);
    border: none;
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
}

.send-btn:hover { transform: scale(1.05); box-shadow: 0 0 24px var(--accent-glow); }
.send-btn:active { transform: scale(0.95); }
.send-btn svg { width: 18px; height: 18px; }

.typing { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px; width: fit-content; }
.typing-dots { display: flex; gap: 4px; }
.typing-dots span { width: 7px; height: 7px; background: var(--accent-hover); border-radius: 50%; animation: bounce 0.8s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.1s; }
.typing-dots span:nth-child(3) { animation-delay: 0.2s; }

@keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-5px); opacity: 1; } }

@media (max-width: 600px) {
    .app-wrapper { padding: 0 16px; }
    .msg-wrap { max-width: 88%; }
    .feature-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="orb-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="app-wrapper">
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="logo">🤖</div>
            <div class="brand-text">
                <h1>Generalist Agent</h1>
                <span>Powered by OpenHands</span>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="status-pill"><div class="status-dot"></div><span>Ready</span></div>
            <button class="icon-btn" onclick="clearChat()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </header>

    <div class="chat-panel">
        <div id="messages" class="chat-messages">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-icon">🤖</div>
                <h2 class="welcome-title">Welcome to Generalist Agent</h2>
                <p class="welcome-desc">Your versatile AI assistant for development and automation tasks.</p>
                <div class="feature-grid">
                    <div class="feature-card"><span>📁</span><span>File Operations</span></div>
                    <div class="feature-card"><span>💻</span><span>Terminal Access</span></div>
                    <div class="feature-card"><span>🌐</span><span>Web Browsing</span></div>
                    <div class="feature-card"><span>🔧</span><span>Code Assistance</span></div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-wrap">
                <div class="chat-input-box">
                    <textarea id="messageInput" class="chat-input" placeholder="Ask me anything..." rows="1"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = 'https://app.all-hands.dev/api/v1';
const API_KEY = 'sk-oh-e47580cG9TT0TFnXyIu4rNozgrI11pkP';

const messagesContainer = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
let lastEventId = null;

messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});

messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

function clearChat() {
    lastEventId = null;
    messagesContainer.innerHTML = `
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">🤖</div>
            <h2 class="welcome-title">Welcome to Generalist Agent</h2>
            <p class="welcome-desc">Your versatile AI assistant for development and automation tasks.</p>
            <div class="feature-grid">
                <div class="feature-card"><span>📁</span><span>File Operations</span></div>
                <div class="feature-card"><span>💻</span><span>Terminal Access</span></div>
                <div class="feature-card"><span>🌐</span><span>Web Browsing</span></div>
                <div class="feature-card"><span>🔧</span><span>Code Assistance</span></div>
            </div>
        </div>
    `;
}

async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;
    
    addMessage(text, 'user');
    messageInput.value = '';
    messageInput.style.height = 'auto';
    showTyping();
    
    try {
        await startConversation(text);
    } catch (error) {
        hideTyping();
        addMessage('Error: ' + error.message + ' 😕', 'bot');
    }
}

async function startConversation(initialMessage) {
    const response = await fetch(API_BASE + '/app-conversations', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify({
            initial_message: {
                content: [{ type: 'text', text: initialMessage }]
            }
        })
    });
    
    if (!response.ok) {
        const errorText = await response.text();
        throw new Error('API request failed: ' + response.status);
    }
    
    const data = await response.json();
    const conversationId = data.app_conversation_id || data.id;
    
    if (!conversationId) {
        throw new Error('No conversation ID returned');
    }
    
    lastEventId = null;
    await pollEvents(conversationId);
}

async function pollEvents(conversationId) {
    while (true) {
        try {
            const response = await fetch(API_BASE + '/conversation/' + conversationId + '/events/search?limit=20', {
                headers: { 'Authorization': 'Bearer ' + API_KEY }
            });
            
            if (!response.ok) {
                await sleep(50);
                continue;
            }
            
            const data = await response.json();
            const items = data.items || [];
            
            if (items.length > 0) {
                // Find new events
                const newEvents = lastEventId === null 
                    ? items 
                    : items.filter((item, idx) => items.indexOf(item) > items.findIndex(e => e.id === lastEventId));
                
                for (const event of newEvents) {
                    processEvent(event);
                    lastEventId = event.id;
                }
                
                // Check if finished
                const lastEvent = items[items.length - 1];
                if (lastEvent && (lastEvent.kind === 'ConversationStatusUpdateEvent' || lastEvent.kind === 'StatusUpdateEvent')) {
                    if (lastEvent.status === 'finished' || lastEvent.value === 'finished') {
                        hideTyping();
                        return;
                    }
                }
            }
            
        } catch (e) {
            console.log('Poll error:', e);
        }
        
        await sleep(50); // Ultra fast polling
    }
}

function processEvent(event) {
    // Message from assistant
    if (event.kind === 'MessageEvent' && event.source === 'assistant') {
        const msg = event.message || event.content || {};
        let text = '';
        if (typeof msg === 'string') text = msg;
        else if (msg.content) {
            text = Array.isArray(msg.content) 
                ? msg.content.map(c => c.text || c.content || '').join('') 
                : msg.content;
        }
        
        if (text && text.trim()) {
            hideTyping();
            addMessage(cleanResponse(text), 'bot');
            showTyping();
        }
    }
    
    // Direct text content
    if (event.content && typeof event.content === 'string' && event.source === 'assistant') {
        hideTyping();
        addMessage(cleanResponse(event.content), 'bot');
        showTyping();
    }
    
    // Observation events (tool results)
    if (event.kind === 'ObservationEvent' && event.observation) {
        const obs = event.observation;
        let text = '';
        if (obs.output) text = obs.output;
        else if (obs.content) text = typeof obs.content === 'string' ? obs.content : '';
        else if (obs.stdout) text = obs.stdout;
        else if (obs.result) text = typeof obs.result === 'string' ? obs.result : '';
        
        if (text && typeof text === 'string' && text.trim().length > 0 && text.trim().length < 500) {
            // Skip very long outputs to avoid flooding
            hideTyping();
            addMessage('📎 ' + cleanResponse(text.substring(0, 500)), 'bot');
            showTyping();
        }
    }
}

const cleanResponse = (text) => {
    if (!text) return '';
    text = text.replace(/<start_of_thought>[\s\S]*?<end_of_thought>/gi, '');
    text = text.replace(/<thought>[\s\S]*?<\/thought>/gi, '');
    text = convertMarkdown(text);
    return text.trim();
};

const convertMarkdown = (text) => {
    if (!text) return '';
    let result = text;
    result = result.replace(/^---$/gm, '');
    result = result.replace(/^### (.+)$/gm, '<h4>$1</h4>');
    result = result.replace(/^## (.+)$/gm, '<h3>$1</h3>');
    result = result.replace(/^# (.+)$/gm, '<h2>$1</h2>');
    result = result.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    result = result.replace(/\*(.+?)\*/g, '<em>$1</em>');
    result = result.replace(/`([^`]+)`/g, '<code>$1</code>');
    result = result.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    result = result.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
    result = result.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
    result = result.replace(/\n\n/g, '<br><br>');
    result = result.replace(/\n/g, '<br>');
    return result;
};

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

function addMessage(content, type) {
    const welcomeScreen = document.getElementById('welcomeScreen');
    if (welcomeScreen) welcomeScreen.remove();
    
    const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const avatarIcon = type === 'bot' ? '🤖' : '👤';
    const safeContent = type === 'bot' ? content : escapeHtml(content);
    
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerHTML = '<div class="msg-avatar">' + avatarIcon + '</div><div class="msg-wrap"><div class="msg-bubble">' + safeContent + '</div><span class="msg-time">' + time + '</span></div>';
    
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function showTyping() {
    hideTyping();
    const div = document.createElement('div');
    div.id = 'typing';
    div.className = 'msg bot';
    div.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-wrap"><div class="typing"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>';
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

const hideTyping = () => { const t = document.getElementById('typing'); if (t) t.remove(); };

const escapeHtml = (text) => {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
};

document.addEventListener('DOMContentLoaded', () => {
    console.log('=== Generalist Agent initialized ===');
});
</script>
</body>
</html>
