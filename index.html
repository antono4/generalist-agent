<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generalist Agent - AI Assistant</title>
<meta name="description" content="Generalist Agent — asisten AI serba guna dengan model gratis tanpa API key.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- latar halus -->
  <div class="bg-scene" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
  </div>

  <div class="layout">
    <!-- ============ Sidebar kiri: brand + percakapan ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <div class="brand-mark">
          <i class="ri-robot-line" aria-hidden="true" style="font-size:19px;"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">Generalist<span class="brand-high">Agent</span></span>
          <span class="brand-tag">AI Workspace</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark" aria-label="Toggle light/dark" aria-pressed="false">
          <i class="ri-sun-line icon-sun"></i>
          <i class="ri-moon-line icon-moon"></i>
        </button>
        <button class="panel-hide" id="panelHide" title="Hide panel" aria-label="Hide panel" aria-expanded="true" aria-controls="sidebar">
          <i class="ri-arrow-left-s-line"></i>
        </button>
      </div>

      <button class="new-thread" id="newThread" title="Start a new conversation">
        <i class="ri-add-line"></i>
        <span>New Conversation</span>
      </button>

      <nav class="conv-bar" aria-label="Conversations">
        <span class="conv-label">Conversations</span>
        <ul id="threadList" class="thread-list"></ul>
      </nav>

      <div class="sidebar-foot">Generalist Agent</div>
    </aside>

    <!-- ============ Kolom utama ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="header-pill"><span class="hp-dot"></span>Generalist Agent</span>
        </div>
        <div class="topbar-right">
          <div class="status-row" role="status" aria-live="polite">
            <span id="statusDot" class="dot" aria-hidden="true"></span>
            <span id="statusLabel">Ready</span>
          </div>
          <button class="btn-icon" onclick="showShortcuts()" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
            <i class="ri-keyboard-line"></i>
          </button>
          <button class="btn-icon" onclick="exportChat()" title="Export chat" aria-label="Export chat">
            <i class="ri-download-line"></i>
          </button>
          <button class="btn-icon" onclick="showSettings()" title="API settings" aria-label="API settings">
            <i class="ri-settings-3-line"></i>
          </button>
          <button class="btn-icon" onclick="clearChat()" title="Clear chat" aria-label="Clear chat">
            <i class="ri-delete-bin-line"></i>
          </button>
          <button class="side-btn" id="sideToggle" title="Hide sidebar" aria-label="Hide sidebar" aria-expanded="true" aria-controls="sidebar">☰</button>
        </div>
      </header>

      <div class="workspace">
        <div id="threadWrap" class="thread-wrap">
          <!-- Welcome screen -->
          <div id="welcome" class="welcome">
            <div class="welcome-inner">
              <span class="eyebrow">✦ Welcome to Generalist Agent</span>
              <h2>Let's <span class="grad">build</span> something</h2>
              <div class="quick-actions">
                <button type="button" class="quick-btn" onclick="quickAction('Create a Python script that:')">
                  <i class="ri-code-line"></i>
                  <span class="qa-tx"><span>Write Code</span><small>Python, JS, Go, etc.</small></span>
                </button>
                <button type="button" class="quick-btn" onclick="quickAction('Help me debug this error:\n\n')">
                  <i class="ri-bug-line"></i>
                  <span class="qa-tx"><span>Debug Error</span><small>Paste your error</small></span>
                </button>
                <button type="button" class="quick-btn" onclick="quickAction('Research and summarize:')">
                  <i class="ri-search-line"></i>
                  <span class="qa-tx"><span>Research</span><small>Find latest info</small></span>
                </button>
                <button type="button" class="quick-btn" onclick="quickAction('Create a modern landing page with:\n\n- Hero section\n- Features\n- Pricing\n- Footer')">
                  <i class="ri-layout-line"></i>
                  <span class="qa-tx"><span>Create UI</span><small>HTML/CSS/React</small></span>
                </button>
                <button type="button" class="quick-btn" onclick="quickAction('Explain this concept:')">
                  <i class="ri-book-open-line"></i>
                  <span class="qa-tx"><span>Explain</span><small>Learn anything</small></span>
                </button>
                <button type="button" class="quick-btn" onclick="quickAction('Optimize this code for better performance:\n\n')">
                  <i class="ri-speed-line"></i>
                  <span class="qa-tx"><span>Optimize</span><small>Speed up code</small></span>
                </button>
              </div>
            </div>
          </div>

          <!-- Area chat -->
          <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation with Generalist Agent"></div>
          <div id="activeBadge" class="active-badge" role="status">
            <span class="spark-ico" aria-hidden="true"><i class="ri-sparkling-2-line"></i></span>
            <span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="sr-only">Generalist Agent is writing a reply…</span>
          </div>
        </div>
      </div>

      <!-- ============ Composer ============ -->
      <form id="form" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask Generalist Agent anything…" aria-label="Message" enterkeyhint="send"></textarea>
        <div class="composer-footer">
          <div class="cf-left">
            <label class="custom-select">
              <span class="cs-label">Model</span>
              <select id="modelSelect" title="Free model">
                <option value="semua">Auto Model (Tercepat)</option>
              </select>
            </label>
          </div>
          <div class="cf-actions">
            <span class="cf-hint" id="composerHint">Enter to send · Shift+Enter for a new line</span>
            <button id="send" type="submit" class="send" title="Send message" aria-label="Send message" disabled>
              <i class="ri-send-plane-fill send-ico" aria-hidden="true"></i>
              <span class="send-spinner" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
