<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generalist Agent - AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
    --bg-primary: #0a0a0b;
    --bg-secondary: #111113;
    --bg-tertiary: #18181b;
    --bg-card: #1c1c1f;
    --bg-input: #141416;
    --bg-hover: #252529;
    --accent: #8b5cf6;
    --accent-hover: #a78bfa;
    --accent-glow: rgba(139, 92, 246, 0.3);
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.1);
    --success: #22c55e;
    --warning: #f59e0b;
    --error: #ef4444;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
}

[data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f4f4f5;
    --bg-tertiary: #e4e4e7;
    --bg-card: #ffffff;
    --bg-input: #f4f4f5;
    --bg-hover: #e4e4e7;
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-muted: #a1a1aa;
    --border: rgba(0, 0, 0, 0.06);
    --border-hover: rgba(0, 0, 0, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
}

/* Background Effects */
.bg-grid {
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}

.bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
}

.bg-glow-1 {
    background: var(--accent);
    top: -200px;
    right: -100px;
}

.bg-glow-2 {
    background: #d946ef;
    bottom: -200px;
    left: -100px;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* App Container */
.app {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px;
    height: 100vh;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
}

.header-left { display: flex; align-items: center; gap: 12px; }

.logo {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
}

.brand h1 {
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.brand span {
    font-size: 0.7rem;
    color: var(--text-muted);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 16px;
}

.btn-icon:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--border-hover);
}

.btn-icon i { font-size: 18px; }

.status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.7rem;
    color: var(--text-secondary);
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
}

.status-dot.processing {
    background: var(--warning);
    animation: pulse 0.5s infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Chat Container */
.chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin: 16px 0;
    min-height: 0;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* Welcome Screen */
.welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
}

.welcome-icon {
    width: 72px;
    height: 72px;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 24px;
    color: white;
}

.welcome h2 {
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}

.welcome p {
    color: var(--text-secondary);
    font-size: 0.9rem;
    max-width: 400px;
    margin-bottom: 32px;
}

.quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 500px;
}

.quick-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.quick-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    color: var(--text-primary);
}

.quick-btn i { font-size: 16px; }

/* Message */
.message {
    display: flex;
    gap: 12px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.avatar {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
}

.message.bot .avatar {
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    color: white;
}

.message.user .avatar {
    background: var(--bg-hover);
    border: 1px solid var(--border);
}

.bubble-wrap {
    max-width: 80%;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.message.user .bubble-wrap { align-items: flex-end; }

.bubble {
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    font-size: 0.9rem;
    line-height: 1.6;
}

.message.bot .bubble {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
}

.message.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    color: white;
}

.time {
    font-size: 0.65rem;
    color: var(--text-muted);
    padding: 0 4px;
}

/* Message Content */
.bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 8px; }
.bubble h1 { font-size: 1.1rem; font-weight: 700; }
.bubble h2 { font-size: 1rem; font-weight: 600; }
.bubble h3 { font-size: 0.95rem; font-weight: 600; }
.bubble strong { font-weight: 600; }
.bubble em { font-style: italic; }
.bubble a { color: var(--accent); }
.bubble code {
    font-family: 'SF Mono', Monaco, monospace;
    font-size: 0.85em;
    background: var(--bg-primary);
    padding: 2px 6px;
    border-radius: 4px;
}
.bubble pre {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    margin: 10px 0;
    overflow-x: auto;
}
.bubble pre code { background: transparent; padding: 0; }
.bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; }
.bubble li { margin: 4px 0; }

/* Input Area */
.input-area {
    padding: 16px 0;
    border-top: 1px solid var(--border);
}

.input-wrapper {
    display: flex;
    gap: 12px;
    align-items: flex-end;
}

.input-box {
    flex: 1;
    display: flex;
    align-items: flex-end;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 4px;
    transition: border-color 0.2s ease;
}

.input-box:focus-within {
    border-color: var(--accent);
}

.input-box textarea {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 0.9rem;
    font-family: inherit;
    resize: none;
    max-height: 150px;
    min-height: 44px;
    line-height: 1.5;
}

.input-box textarea:focus { outline: none; }
.input-box textarea::placeholder { color: var(--text-muted); }

.send-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    border: none;
    background: linear-gradient(135deg, var(--accent) 0%, #d946ef 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
}

.send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent-glow); }
.send-btn:active { transform: scale(0.95); }
.send-btn i { font-size: 20px; }

/* Typing Indicator */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
    width: fit-content;
}

.typing-dots {
    display: flex;
    gap: 4px;
}

.typing-dots span {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1s ease-in-out infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.1s; }
.typing-dots span:nth-child(3) { animation-delay: 0.2s; }

@keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}

/* Toast Notification */
.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 0.85rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    z-index: 1000;
    animation: toastIn 0.3s ease;
}

@keyframes toastIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Shortcuts Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
}

.modal h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.shortcut-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.shortcut-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
}

.shortcut-item span { font-size: 0.85rem; color: var(--text-secondary); }

.kbd {
    padding: 4px 8px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.75rem;
    font-family: monospace;
}

.modal-close {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

/* Responsive */
@media (max-width: 600px) {
    .app { padding: 0 12px; }
    .bubble-wrap { max-width: 90%; }
    .welcome h2 { font-size: 1.25rem; }
    .quick-actions { flex-direction: column; }
    .quick-btn { width: 100%; justify-content: center; }
    .status-text { display: none; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="app">
    <header class="header">
        <div class="header-left">
            <div class="logo"><i class="ri-robot-line"></i></div>
            <div class="brand">
                <h1>Generalist Agent</h1>
                <span>Powered by OpenHands</span>
            </div>
        </div>
        <div class="header-right">
            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText" class="status-text">Ready</span>
            </div>
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle Theme">
                <i id="themeIcon" class="ri-sun-line"></i>
            </button>
            <button class="btn-icon" onclick="showShortcuts()" title="Keyboard Shortcuts">
                <i class="ri-keyboard-line"></i>
            </button>
            <button class="btn-icon" onclick="exportChat()" title="Export Chat">
                <i class="ri-download-line"></i>
            </button>
            <button class="btn-icon" onclick="showSettings()" title="API Settings">
                <i class="ri-settings-3-line"></i>
            </button>
            <button class="btn-icon" onclick="clearChat()" title="Clear Chat">
                <i class="ri-delete-bin-line"></i>
            </button>
        </div>
    </header>

    <div class="chat-container">
        <div id="messages" class="chat-messages">
            <div id="welcome" class="welcome">
                <div class="welcome-icon"><i class="ri-robot-line"></i></div>
                <h2>Welcome to Generalist Agent</h2>
                <p>Your versatile AI assistant for development, automation, and more.</p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAction('Write a Python script to...')">
                        <i class="ri-code-line"></i>
                        Write Code
                    </button>
                    <button class="quick-btn" onclick="quickAction('Debug this error and explain:')">
                        <i class="ri-bug-line"></i>
                        Debug Error
                    </button>
                    <button class="quick-btn" onclick="quickAction('Research the latest trends in:')">
                        <i class="ri-search-line"></i>
                        Research
                    </button>
                    <button class="quick-btn" onclick="quickAction('Create a landing page with:')">
                        <i class="ri-layout-line"></i>
                        Create UI
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="messageInput" placeholder="Type your message... (Ctrl+Enter to send)" rows="1"></textarea>
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <i class="ri-send-plane-fill"></i>
            </button>
        </div>
    </div>
</div>

<script>
// API Configuration
let API_MODE = localStorage.getItem('api_mode') || 'openhands'; // 'openhands' or 'custom'

// OpenHands API (default)
const OH_API_BASE = 'https://app.all-hands.dev/api/v1';
const OH_API_KEY = 'sk-oh-e47580cG9TT0TFnXyIu4rNozgrI11pkP';

// Custom LLM API (from free-llm-api-keys)
let CUSTOM_API_BASE = localStorage.getItem('custom_api_base') || '';
let CUSTOM_API_KEY = localStorage.getItem('custom_api_key') || '';
let CUSTOM_MODEL = localStorage.getItem('custom_model') || 'gpt-5.5';

const messagesContainer = document.getElementById('messages');
const welcomeScreen = document.getElementById('welcome');
const messageInput = document.getElementById('messageInput');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const themeIcon = document.getElementById('themeIcon');

let lastEventId = null;
let conversationId = null;
let chatHistory = [];

// Theme
function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    themeIcon.className = newTheme === 'light' ? 'ri-moon-line' : 'ri-sun-line';
    localStorage.setItem('theme', newTheme);
}

// Load saved theme
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
themeIcon.className = savedTheme === 'light' ? 'ri-moon-line' : 'ri-sun-line';

// Input handling
messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});

messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendMessage();
    }
});

// Quick actions
function quickAction(text) {
    messageInput.value = text;
    messageInput.focus();
}

// Status
function setStatus(status, text) {
    statusDot.className = 'status-dot';
    if (status === 'processing') statusDot.classList.add('processing');
    if (status === 'error') statusDot.style.background = 'var(--error)';
    else statusDot.style.background = '';
    statusText.textContent = text;
}

// Clear chat
function clearChat() {
    if (!confirm('Clear all messages?')) return;
    chatHistory = [];
    conversationId = null;
    lastEventId = null;
    messagesContainer.innerHTML = `
        <div id="welcome" class="welcome">
            <div class="welcome-icon"><i class="ri-robot-line"></i></div>
            <h2>Welcome to Generalist Agent</h2>
            <p>Your versatile AI assistant for development, automation, and more.</p>
            <div class="quick-actions">
                <button class="quick-btn" onclick="quickAction('Write a Python script to...')">
                    <i class="ri-code-line"></i>
                    Write Code
                </button>
                <button class="quick-btn" onclick="quickAction('Debug this error and explain:')">
                    <i class="ri-bug-line"></i>
                    Debug Error
                </button>
                <button class="quick-btn" onclick="quickAction('Research the latest trends in:')">
                    <i class="ri-search-line"></i>
                    Research
                </button>
                <button class="quick-btn" onclick="quickAction('Create a landing page with:')">
                    <i class="ri-layout-line"></i>
                    Create UI
                </button>
            </div>
        </div>
    `;
    setStatus('ready', 'Ready');
    showToast('Chat cleared');
}

// Export chat
function exportChat() {
    if (chatHistory.length === 0) {
        showToast('No messages to export');
        return;
    }
    
    const content = chatHistory.map(m => `**${m.role === 'user' ? 'You' : 'Assistant'}**\n${m.content}\n`).join('\n---\n\n');
    const blob = new Blob([content], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `chat-${new Date().toISOString().slice(0, 10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Chat exported as Markdown');
}

// Keyboard shortcuts modal
function showShortcuts() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
        <div class="modal">
            <h3><i class="ri-keyboard-line"></i> Keyboard Shortcuts</h3>
            <div class="shortcut-list">
                <div class="shortcut-item">
                    <span>Send message</span>
                    <span><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">Enter</kbd></span>
                </div>
                <div class="shortcut-item">
                    <span>New line in message</span>
                    <span><kbd class="kbd">Shift</kbd> + <kbd class="kbd">Enter</kbd></span>
                </div>
                <div class="shortcut-item">
                    <span>Toggle theme</span>
                    <span><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">T</kbd></span>
                </div>
                <div class="shortcut-item">
                    <span>Export chat</span>
                    <span><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">E</kbd></span>
                </div>
                <div class="shortcut-item">
                    <span>Clear chat</span>
                    <span><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">L</kbd></span>
                </div>
            </div>
            <button class="modal-close" onclick="this.parentElement.parentElement.remove()">Close</button>
        </div>
    `;
    document.body.appendChild(modal);
}

function setApiMode(mode, btn) {
    API_MODE = mode;
    localStorage.setItem('api_mode', mode);
    
    // Update button styles
    document.querySelectorAll('.modal .quick-btn').forEach(b => {
        b.style.borderColor = '';
        b.style.background = '';
    });
    btn.style.borderColor = 'var(--accent)';
    btn.style.background = 'var(--bg-hover)';
    
    // Show/hide custom settings
    const settingsDiv = document.getElementById('customApiSettings');
    if (settingsDiv) {
        settingsDiv.style.display = mode === 'custom' ? 'block' : 'none';
    }
}

function saveSettings() {
    if (API_MODE === 'custom') {
        CUSTOM_API_BASE = document.getElementById('customApiBase').value.trim();
        CUSTOM_API_KEY = document.getElementById('customApiKey').value.trim();
        CUSTOM_MODEL = document.getElementById('customModel').value;
        
        localStorage.setItem('custom_api_base', CUSTOM_API_BASE);
        localStorage.setItem('custom_api_key', CUSTOM_API_KEY);
        localStorage.setItem('custom_model', CUSTOM_MODEL);
        
        if (!CUSTOM_API_BASE || !CUSTOM_API_KEY) {
            showToast('Please enter API Base URL and Key');
            return;
        }
    }
    showToast('Settings saved!');
}

// Global shortcuts
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
        if (e.key === 't') { e.preventDefault(); toggleTheme(); }
        if (e.key === 'e') { e.preventDefault(); exportChat(); }
        if (e.key === 'l') { e.preventDefault(); clearChat(); }
    }
});

// Toast
function showToast(message) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// Send message
async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;
    
    // Remove welcome screen
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();
    
    addMessage(text, 'user');
    chatHistory.push({ role: 'user', content: text });
    messageInput.value = '';
    messageInput.style.height = 'auto';
    showTyping();
    setStatus('processing', 'Processing...');
    
    try {
        if (API_MODE === 'custom' && CUSTOM_API_BASE && CUSTOM_API_KEY) {
            await sendToCustomLLM(text);
        } else {
            await startConversation(text);
        }
    } catch (error) {
        hideTyping();
        setStatus('error', 'Error');
        addMessage('Error: ' + error.message, 'bot');
        setTimeout(() => setStatus('ready', 'Ready'), 3000);
    }
}

// Custom LLM API (OpenAI-compatible)
async function sendToCustomLLM(message) {
    const response = await fetch(CUSTOM_API_BASE + '/chat/completions', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + CUSTOM_API_KEY
        },
        body: JSON.stringify({
            model: CUSTOM_MODEL,
            messages: chatHistory
        })
    });
    
    if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error?.message || 'API request failed: ' + response.status);
    }
    
    const data = await response.json();
    const assistantMessage = data.choices[0]?.message?.content || '';
    
    hideTyping();
    if (assistantMessage) {
        addMessage(assistantMessage, 'bot');
        chatHistory.push({ role: 'assistant', content: assistantMessage });
    }
    setStatus('ready', 'Ready');
}

async function startConversation(initialMessage) {
    const response = await fetch(OH_API_BASE + '/app-conversations', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + OH_API_KEY
        },
        body: JSON.stringify({
            initial_message: { content: [{ type: 'text', text: initialMessage }] }
        })
    });
    
    if (!response.ok) throw new Error('API request failed: ' + response.status);
    
    const data = await response.json();
    conversationId = data.app_conversation_id || data.id;
    if (!conversationId) throw new Error('No conversation ID');
    
    lastEventId = null;
    await pollEvents(conversationId);
}

async function pollEvents(convId) {
    let consecutiveEmptyPolls = 0;
    // API rate limit: 100 requests per minute = 600ms minimum between requests
    const baseDelay = 600; // Safe interval for rate limit compliance
    
    while (true) {
        try {
            const response = await fetch(OH_API_BASE + '/conversation/' + convId + '/events/search?limit=50', {
                headers: { 'Authorization': 'Bearer ' + OH_API_KEY }
            });
            
            if (!response.ok) { 
                await sleep(baseDelay); 
                consecutiveEmptyPolls = 0;
                continue; 
            }
            
            const data = await response.json();
            const items = data.items || [];
            
            // Adaptive polling: slow down if no new events
            if (items.length === 0) {
                consecutiveEmptyPolls++;
                await sleep(baseDelay + (consecutiveEmptyPolls * 100)); // Gradually slow down
                continue;
            }
            
            consecutiveEmptyPolls = 0;
            
            for (const event of items) {
                if (event.id === lastEventId) continue;
                processEvent(event);
                lastEventId = event.id;
            }
            
            // Check completion
            const last = items[items.length - 1];
            if (last && (last.status === 'finished' || last.value === 'finished' || last.status === 'completed')) {
                hideTyping();
                setStatus('ready', 'Ready');
                return;
            }
            
            // Polling with slight speedup when active (but still under rate limit)
            await sleep(baseDelay - 100); // 500ms when actively receiving events
            
        } catch (e) { 
            console.log('Poll error:', e); 
            await sleep(baseDelay * 2); // Back off on errors
        }
    }
}

function processEvent(event) {
    // Message event
    if (event.kind === 'MessageEvent' && event.source === 'assistant') {
        const msg = event.message || event.content || {};
        let text = typeof msg === 'string' ? msg : (msg.content || '');
        if (typeof text !== 'string') text = Array.isArray(text) ? text.map(c => c.text || c.content || '').join('') : '';
        
        if (text && text.trim()) {
            hideTyping();
            const cleaned = cleanResponse(text);
            chatHistory.push({ role: 'assistant', content: cleaned });
            addMessage(cleaned, 'bot');
        }
    }
    
    // Tool action - batch these to reduce DOM updates
    if (event.kind === 'ActionEvent' && event.action) {
        const action = event.action;
        if (action.tool_name) {
            hideTyping();
            addMessage('🔧 Using: ' + action.tool_name, 'bot');
        }
    }
}

function cleanResponse(text) {
    text = text.replace(/<start_of_thought>[\s\S]*?<end_of_thought>/gi, '');
    text = text.replace(/<thought>[\s\S]*?<\/thought>/gi, '');
    return text.trim();
}

function addMessage(content, type) {
    const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const avatar = type === 'bot' ? '<i class="ri-robot-line"></i>' : '<i class="ri-user-line"></i>';
    const safeContent = type === 'bot' ? content : escapeHtml(content);
    
    const div = document.createElement('div');
    div.className = 'message ' + type;
    div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble-wrap">
            <div class="bubble">${safeContent}</div>
            <span class="time">${time}</span>
        </div>
    `;
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function showTyping() {
    hideTyping();
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typing';
    div.innerHTML = `
        <div class="avatar"><i class="ri-robot-line"></i></div>
        <div class="bubble-wrap">
            <div class="typing-indicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    `;
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
}

const escapeHtml = (text) => {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
};

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
</script>
